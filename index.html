<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Teacher — learn on the whiteboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&family=Patrick+Hand&family=Space+Grotesk:wght@500;600&family=Press+Start+2P&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <header class="app-header">
    <span class="brand">AI Teacher</span>
    <div class="gamification-status">
      <div class="level-badge" id="levelBadge">LVL 1</div>
      <div class="xp-bar-container">
        <div class="xp-bar-fill" id="xpBarFill"></div>
      </div>
      <div class="xp-text" id="xpText">0 / 100 XP</div>
    </div>
    <button id="newTopicBtn" class="ghost-btn" hidden>New topic</button>
  </header>

  <main class="board-frame">
    <div class="board-tray" aria-hidden="true"></div>
    <div class="board-viewport" id="boardViewport">
      <div class="board-intro" id="boardIntro">
        <p class="intro-label">What should I teach you today?</p>
        <form id="topicForm" class="topic-form">
          <input
            id="topicInput"
            type="text"
            placeholder="e.g. photosynthesis, Newton's second law, binary search…"
            autocomplete="off"
          />
          <button type="submit">Start lesson</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="ask-dock" id="askDock" hidden>
    <form id="askForm">
      <input id="askInput" type="text" placeholder="Ask a question about this lesson…" autocomplete="off" />
      <button type="submit">Ask</button>
    </form>
    <p class="status" id="statusLine"></p>
  </footer>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
